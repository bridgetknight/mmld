name: Build and Release EXE

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (v1.0, v1.1, etc.)

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build EXE
      run: |
        pyinstaller export_pipeline.spec
    
    - name: Prepare distribution folder
      run: |
        mkdir -p dist_release
        copy dist\export_pipeline.exe dist_release\
        copy run_export.bat dist_release\
        copy README.md dist_release\
        copy requirements.txt dist_release\
    
    - name: Create ZIP archive
      run: |
        powershell -Command "Compress-Archive -Path dist_release\* -DestinationPath nexgrid_importer_${{ github.ref_name }}.zip"
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: nexgrid_importer_${{ github.ref_name }}.zip
        body: "Nexgrid CSV Importer - ${{ github.ref_name }}\n\nInstructions:\n1. Unzip the archive\n2. Double-click `run_export.bat` after placing a CSV in the `nexgrid_hourly_reports_monthly` folder\n3. Processed files are automatically archived to the `archive` folder"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
