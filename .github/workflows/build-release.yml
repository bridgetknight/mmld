name: Build and Release EXE

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (v1.0, v1.1, etc.)

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build onedir bundle
      run: |
        pyinstaller --clean --onedir --noupx --exclude-module matplotlib --exclude-module seaborn --exclude-module sklearn --name export_pipeline src/export_pipeline.py

    - name: Prepare distribution folder
      run: |
        if not exist dist_release mkdir dist_release
        if not exist dist_release\incoming mkdir dist_release\incoming
        if not exist dist_release\archive mkdir dist_release\archive
        xcopy /E /I /Y dist\export_pipeline dist_release\export_pipeline
        copy run_export.bat dist_release\
        copy README.md dist_release\
        echo.> dist_release\incoming\.gitkeep
        echo.> dist_release\archive\.gitkeep
    
    - name: Create ZIP archive
      run: |
        powershell -Command "Compress-Archive -Path dist_release\* -DestinationPath nexgrid_importer_${{ github.ref_name }}.zip"
        del dist_release\incoming\.gitkeep
        del dist_release\archive\.gitkeep
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: nexgrid_importer_${{ github.ref_name }}.zip
        body: "Nexgrid CSV Importer - ${{ github.ref_name }}\n\nInstructions:\n1. Unzip the archive\n2. Double-click `run_export.bat` after placing a CSV in the `incoming` folder\n3. Processed files are automatically archived to the `archive` folder"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
